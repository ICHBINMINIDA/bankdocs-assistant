spring.application.name=bankdocs-assistant
llm.base-url=${LLM_BASE_URL:http://host.docker.internal:4002/v1}
llm.api-key=${LLM_API_KEY:dummy}
llm.model=${LLM_MODEL:robot-default}
llm.embedding-model=${LLM_EMBEDDING_MODEL:embed-default}
# 0.0 = deterministic answers, needed for reproducible accuracy measurements
llm.temperature=${LLM_TEMPERATURE:0.0}
rag.ingest-on-startup=${RAG_INGEST_ON_STARTUP:true}
rag.max-results=4
# Measured with bge-m3: relevant chunks score 0.81-0.88, off-topic questions 0.67-0.69
rag.min-score=0.75
rag.chunk-size=1000
rag.chunk-overlap=100
# Drop splitter leftovers such as a lone "Uebertragungswege." (comment kept ASCII: .properties is read as ISO-8859-1)
rag.min-segment-length=40
